spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
      username: ${SPRING_DATASOURCE_USERNAME:postgres.pqbqrvqmtjixymawcyst}
      password: ${SPRING_DATASOURCE_PASSWORD:gSMk2uKBBmzwnSgY}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_POOL_SIZE:2}
        minimum-idle: ${DB_MIN_IDLE:0}
        connection-timeout: ${DB_CONN_TIMEOUT_MS:30000}
        idle-timeout: ${DB_IDLE_TIMEOUT_MS:60000}
        max-lifetime: ${DB_MAX_LIFETIME_MS:300000}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration/sgi
    table: flyway_schema_history_sgi
    baseline-on-migrate: true
    baseline-version: 0
logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.zaxxer.hikari.HikariConfig: INFO
    com.zaxxer.hikari: INFO
server:
  port: ${PORT:8081}

app:
  logging:
    request-timing:
      enabled: true
      min-ms: 200
    dashboard-timing:
      enabled: true
      min-ms: 200
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,https://sgi-frontend.web.app}
  sri:
    client: soap
    xmlVersion: "1.0.0"
    contribuyente:
      enabled: true
      base-url: ${SRI_CONTRIBUYENTE_URL:https://srienlinea.sri.gob.ec/sri-catastro-sujeto-servicio-internet/rest/ConsolidadoContribuyente/obtenerPorNumerosRuc}
      timeout-ms: ${SRI_CONTRIBUYENTE_TIMEOUT_MS:4000}
    pruebas:
      recepcion-url: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline?wsdl
      autorizacion-url: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline?wsdl
      consulta-comprobante-url: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/ConsultaComprobante?wsdl
      consulta-factura-url: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/ConsultaFactura?wsdl
    produccion:
      recepcion-url: https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline?wsdl
      autorizacion-url: https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline?wsdl
      consulta-comprobante-url: https://cel.sri.gob.ec/comprobantes-electronicos-ws/ConsultaComprobante?wsdl
      consulta-factura-url: https://cel.sri.gob.ec/comprobantes-electronicos-ws/ConsultaFactura?wsdl
