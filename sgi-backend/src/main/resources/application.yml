      max-intentos: 10
      consulta-inmediata:
        enabled: true
        delay-ms: 10000
    scheduler:
      enabled: false
      fixed-delay-ms: 15000
    email:
      auto-send-authorized: true
    xml-firmado:
      store: true
      compress: true
  security:
    jwt:
      secret: "Odhdz2Lrt9vEtM4r8hf4x68tAaqihJJzgLz91OFOddXKgKdOB5KlxtYn3XO__LsJ"
      expiration-seconds: 86400
  empresa:
    logo:
      storageDir: storage/logos

mail:
